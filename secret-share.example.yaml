# secret-share example config. Copy to secret-share.yaml and edit, or drive
# everything via SHARE_* environment variables. Every key maps to an env var:
# section.key -> SHARE_SECTION_KEY (dots become underscores, uppercased).
# The env var name is shown after each setting below; env values override the file.

server:
  addr: ":3000"                  # SHARE_SERVER_ADDR
  # Set when a reverse proxy terminates TLS in front of this app, so HSTS is sent.
  behind_tls_proxy: true         # SHARE_SERVER_BEHIND_TLS_PROXY
  # Proxy IPs/CIDRs trusted to set X-Forwarded-* (for the real client IP/scheme).
  trusted_proxies: ["10.0.0.0/8"] # SHARE_SERVER_TRUSTED_PROXIES (comma-separated)

  # TLS - terminate HTTPS directly.
  # Default "none" = plain HTTP (use a reverse proxy + behind_tls_proxy above).
  # Set ONE of the modes below instead.
  tls:
    mode: "none"                 # SHARE_SERVER_TLS_MODE - none | manual | self | acme
    # mode: manual - operator-supplied PEM cert + key:
    cert: ""                     # SHARE_SERVER_TLS_CERT - path to PEM certificate
    key: ""                      # SHARE_SERVER_TLS_KEY - path to PEM private key
    # mode: self - in-memory self-signed cert (dev / internal only):
    fqdn: ""                     # SHARE_SERVER_TLS_FQDN - hostname put in the cert SAN
    alg: "rsa"                   # SHARE_SERVER_TLS_ALG - rsa | ed25519
    # mode: acme - Let's Encrypt (needs the http_addr port reachable on :80):
    acme:
      email: ""                  # SHARE_SERVER_TLS_ACME_EMAIL - ACME account email
      cache_dir: "./certs"       # SHARE_SERVER_TLS_ACME_CACHE_DIR - persist issued certs (mount a volume!)
      http_addr: ":80"           # SHARE_SERVER_TLS_ACME_HTTP_ADDR - HTTP-01 challenge listener
      hosts: ["share.example.com"] # SHARE_SERVER_TLS_ACME_HOSTS (comma-separated) - cert hostname whitelist

database:
  # Single embedded bbolt file.
  path: "/var/lib/secret-share/secret-share.db" # SHARE_DATABASE_PATH
  sweep_interval: "1m"           # SHARE_DATABASE_SWEEP_INTERVAL - expired-secret purge cadence

secrets:
  max_size_bytes: 65536          # SHARE_SECRETS_MAX_SIZE_BYTES - cap per secret (default 64 KiB)
  default_ttl: "1h"              # SHARE_SECRETS_DEFAULT_TTL - used when the UI sends no lifetime
  max_ttl: "168h"                # SHARE_SECRETS_MAX_TTL - ceiling on any requested lifetime (incl. custom)
  allowed_ttls: ["5m", "1h", "24h", "168h"] # SHARE_SECRETS_ALLOWED_TTLS (comma-separated) - UI presets

# Auth - "private mode". Default OFF: every endpoint is open (the original
# behavior). Turn it on to require sign-in and stop anonymous abuse. Auth is an
# orthogonal access gate; the zero-knowledge model is unchanged (the server still
# only ever stores opaque ciphertext).
auth:
  enabled: false                 # SHARE_AUTH_ENABLED - master switch (default false = public)
  # gate selects WHAT requires a session when enabled:
  #   create - only creating a secret needs login; opening a link stays public
  #            (so you can share with external recipients who have no account).
  #   all    - creating, previewing (meta), and revealing all need login (internal-only).
  gate: "create"                 # SHARE_AUTH_GATE - create | all
  # session_secret keys the session cookie AND seals TOTP secrets at rest. REQUIRED
  # (>= 32 chars) when enabled. Rotating it logs everyone out and forces 2FA re-enroll.
  session_secret: ""             # SHARE_AUTH_SESSION_SECRET
  session_ttl: "12h"             # SHARE_AUTH_SESSION_TTL - session lifetime
  local_login: true              # SHARE_AUTH_LOCAL_LOGIN - allow email+password / passkey sign-in

  # Bootstrap the first admin on first boot (idempotent; left untouched if it
  # already exists). Or create users out-of-band with `secret-share user create`.
  bootstrap_admin:
    email: ""                    # SHARE_AUTH_BOOTSTRAP_ADMIN_EMAIL
    password: ""                 # SHARE_AUTH_BOOTSTRAP_ADMIN_PASSWORD (8-72 chars; omit for an SSO-only admin)

  # OIDC single sign-on providers. One login button is rendered per provider.
  #
  # Providers can be set in this file, via environment variables, or BOTH. The env
  # var name is SHARE_AUTH_OIDC_<ID>_<FIELD>, where <ID> is the provider id
  # uppercased with '-' -> '_' (id "azure-ad" -> SHARE_AUTH_OIDC_AZURE_AD_*).
  # Fields: ISSUER, CLIENT_ID, CLIENT_SECRET, REDIRECT_URL, LABEL, SCOPES,
  # REQUIRE_EMAIL_VERIFIED, ALLOWED_DOMAINS, ALLOWED_EMAILS, GROUPS_CLAIM,
  # ADMIN_EMAILS, ADMIN_GROUPS, USER_GROUPS, DEFAULT_ROLE (list fields are
  # comma-separated). Two ways to use it:
  #
  #   1. Keep config here, inject only secrets via env (recommended):
  #        define the provider below WITHOUT client_secret, then set
  #        SHARE_AUTH_OIDC_GOOGLE_CLIENT_SECRET=... at runtime. Any per-field env
  #        var overrides the matching file value for that provider id.
  #   2. Env-only (no file): set SHARE_AUTH_OIDC_PROVIDERS=google,entra (the ids)
  #        plus SHARE_AUTH_OIDC_<ID>_* for each. This REPLACES the file list.
  #
  # NOTE: issuer must be a real OIDC provider (serves /.well-known/openid-configuration).
  # GitHub is OAuth2-only and is NOT supported. redirect_url must end with
  # /api/auth/oidc/<id>/callback.
  oidc: []
  #   - id: google                 # stable, url-safe, unique
  #     label: "Google"            # login button text
  #     issuer: "https://accounts.google.com"
  #     client_id: ""
  #     client_secret: ""
  #     redirect_url: "https://share.example.com/api/auth/oidc/google/callback"
  #     scopes: ["openid", "email", "profile"]
  #     require_email_verified: true
  #     allowed_domains: ["acme.com"]   # admit anyone with an @acme.com email
  #     # allowed_emails: []
  #     # groups_claim: "groups"        # claim holding the user's groups
  #     # admin_emails: ["boss@acme.com"]   # pinned admins (exempt from group downgrade)
  #     # admin_groups: ["secret-share-admins"]
  #     # user_groups: ["staff"]
  #     default_role: "user"        # role when no admin/user rule matches ("none" = deny)
  #   - id: entra
  #     label: "Microsoft"
  #     issuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  #     client_id: ""
  #     client_secret: ""
  #     redirect_url: "https://share.example.com/api/auth/oidc/entra/callback"
  #     allowed_domains: ["acme.com"]
  #     default_role: "user"

logging:
  level: "info"                  # SHARE_LOGGING_LEVEL - debug | info | warn | error
  format: "json"                 # SHARE_LOGGING_FORMAT - json | text
  output: "stdout"               # SHARE_LOGGING_OUTPUT - stdout | stderr | file path
  color: false                   # SHARE_LOGGING_COLOR - ANSI colors (text format only)
