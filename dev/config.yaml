# Dev config for `make dev`. NOT for production.
server:
  addr: ":3000"

database:
  path: "./dev/secret-share.db"
  sweep_interval: "30s"

secrets:
  max_size_bytes: 65536
  default_ttl: "24h"
  max_ttl: "168h"
  allowed_ttls: ["5m", "1h", "24h", "168h"]

logging:
  level: "debug"
  format: "text"
  color: true
