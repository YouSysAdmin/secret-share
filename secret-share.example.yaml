# secret-share example config. Copy to secret-share.yaml and edit, or drive
# everything via SHARE_* environment variables. Every key maps to an env var:
# section.key -> SHARE_SECTION_KEY (dots become underscores, uppercased).
# The env var name is shown after each setting below; env values override the file.

server:
  addr: ":3000"                  # SHARE_SERVER_ADDR
  # Set when a reverse proxy terminates TLS in front of this app, so HSTS is sent.
  behind_tls_proxy: true         # SHARE_SERVER_BEHIND_TLS_PROXY
  # Proxy IPs/CIDRs trusted to set X-Forwarded-* (for the real client IP/scheme).
  trusted_proxies: ["10.0.0.0/8"] # SHARE_SERVER_TRUSTED_PROXIES (comma-separated)

  # TLS — terminate HTTPS directly.
  # Default "none" = plain HTTP (use a reverse proxy + behind_tls_proxy above).
  # Set ONE of the modes below instead.
  tls:
    mode: "none"                 # SHARE_SERVER_TLS_MODE — none | manual | self | acme
    # mode: manual — operator-supplied PEM cert + key:
    cert: ""                     # SHARE_SERVER_TLS_CERT — path to PEM certificate
    key: ""                      # SHARE_SERVER_TLS_KEY — path to PEM private key
    # mode: self — in-memory self-signed cert (dev / internal only):
    fqdn: ""                     # SHARE_SERVER_TLS_FQDN — hostname put in the cert SAN
    alg: "rsa"                   # SHARE_SERVER_TLS_ALG — rsa | ed25519
    # mode: acme — Let's Encrypt (needs the http_addr port reachable on :80):
    acme:
      email: ""                  # SHARE_SERVER_TLS_ACME_EMAIL — ACME account email
      cache_dir: "./certs"       # SHARE_SERVER_TLS_ACME_CACHE_DIR — persist issued certs (mount a volume!)
      http_addr: ":80"           # SHARE_SERVER_TLS_ACME_HTTP_ADDR — HTTP-01 challenge listener
      hosts: ["share.example.com"] # SHARE_SERVER_TLS_ACME_HOSTS (comma-separated) — cert hostname whitelist

database:
  # Single embedded bbolt file.
  path: "/var/lib/secret-share/secret-share.db" # SHARE_DATABASE_PATH
  sweep_interval: "1m"           # SHARE_DATABASE_SWEEP_INTERVAL — expired-secret purge cadence

secrets:
  max_size_bytes: 65536          # SHARE_SECRETS_MAX_SIZE_BYTES — cap per secret (default 64 KiB)
  default_ttl: "1h"              # SHARE_SECRETS_DEFAULT_TTL — used when the UI sends no lifetime
  max_ttl: "168h"                # SHARE_SECRETS_MAX_TTL — ceiling on any requested lifetime (incl. custom)
  allowed_ttls: ["5m", "1h", "24h", "168h"] # SHARE_SECRETS_ALLOWED_TTLS (comma-separated) — UI presets

logging:
  level: "info"                  # SHARE_LOGGING_LEVEL — debug | info | warn | error
  format: "json"                 # SHARE_LOGGING_FORMAT — json | text
  output: "stdout"               # SHARE_LOGGING_OUTPUT — stdout | stderr | file path
  color: false                   # SHARE_LOGGING_COLOR — ANSI colors (text format only)
